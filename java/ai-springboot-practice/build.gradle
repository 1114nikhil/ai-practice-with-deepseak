 plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'ai.springboot'
version = '0.0.1-SNAPSHOT'
description = 'ai-springboot-practice'

 ext {
     springAiVersion = '2.0.0'
 }

 subprojects {
     // Shared Java configuration for all modules
     apply plugin: 'java'
     apply plugin: 'io.spring.dependency-management'

     java {
         toolchain {
             languageVersion = JavaLanguageVersion.of(21)
         }
     }

     // Share Spring AI dependency versions with every module
     dependencyManagement {
         imports {
             mavenBom "org.springframework.ai:spring-ai-bom:${rootProject.ext.springAiVersion}"
         }
     }

     tasks.withType(Test).configureEach {
         useJUnitPlatform()
     }
 }
 tasks.named('bootJar') {
     enabled = false
 }