spring:
  application:
    name: ai-service

ai:
  anthropic:
    api-key: ${ANTHROPIC_API_KEY}
    chat:
      option:
        model: ${MODEL}
        max-tokens: ${MAX_TOKENS}

server:
  port:8081

springdotenv:
  directory: ../../

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true
